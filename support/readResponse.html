<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
    <title>문의답변 - 오마이프린트</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="./css/read.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <script src="../js/include.js" defer></script>
    <script src="./js/read_response.js" defer></script>
  </head>
  <body>
    <header id="header"></header>
    <main class="read">
      <section class="inner">
        <h1 class="font28b response">질문/답변</h1>

        <div class="title">
          <p class="font20b">문의드립니다.2</p>
          <div class="dateWrap">
            <span class="font14b">게시일:</span>
            <span class="font12">2025/08/19</span>
          </div>
        </div>

        <div class="response-text-box font18">문의드립니다</div>

        <div class="answer-box">
          <div class="answer-item">
            <div class="left-item">
              <p class="font16b answer-title">
                고객님 안녕하세요. 오마이프린트를 찾아주셔서 감사합니다. 문의주신 내용 답변드립니다.
              </p>
            </div>
            <div class="font16 answer-date">2025/08/20</div>
          </div>
        </div>

        <div class="post-list">
          <div class="post-bar">
            <a href="#">
              <div class="left-box">
                <div class="left-inner">
                  <span class="font16b text">이전글</span>
                  <span class="font12 tab">|</span>
                </div>
                <span class="font14 title-box">문의드립내다.1</span>
              </div>
              <span class="font16 date-box">2025/08/18</span>
            </a>
          </div>
          <div class="post-bar">
            <a href="#">
              <div class="left-box">
                <div class="left-inner">
                  <span class="font16b text">다음글</span>
                  <span class="font12 tab">|</span>
                </div>
                <span class="font14 title-box">등록된 다음 게시물이 없습니다.</span>
              </div>
              <span class="font16 date-box"></span>
            </a>
          </div>
        </div>

        <div class="button-wrap">
          <button class="font16b">목록</button>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
