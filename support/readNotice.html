<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
    <title>공지사항 - 오마이프린트</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="./css/read.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <script src="../js/include.js" defer></script>
  </head>
  <body>
    <header id="header"></header>
    <main>
      <section class="inner">
        <h1 class="font28b title">공지사항</h1>

        <div class="notice-title">
          <p class="font20b">오 마이 프린트 몰을 오픈합니다.</p>
          <div>
            <span class="font14b">게시일:</span>
            <span class="font12">2020-11-01</span>
          </div>
        </div>

        <div class="notice-text-box">
          <p class="font18b">
            아직 상품도 다 올리지 못하고 부분부분 부족한 점이 많습니다
            <br />
            그럼에도 불구하고 먼저 오픈합니다.
          </p>

          <p class="font18b">부족한점들은 차차 채워 가겠습니다.</p>
          <p class="font18b">
            여기 올려진 상품과 올려진 상품외에 다른 인쇄상품도 궁금한점 있으시면 언제든
            문의해주세요.
            <br />
            문의하기에 올리셔도 좋고 카톡채널로 물어보셔도 좋습니다.
          </p>

          <p class="font18b">여러분들과 함께하는 오마이프린트가 되겠습니다.</p>
          <p class="font18b">감사합니다.</p>
        </div>

        <div class="post-list">
          <div class="post-bar">
            <a href="#">
              <div class="left-box">
                <div class="left-inner">
                  <span class="font16b text">이전글</span>
                  <span class="font12 tab">|</span>
                </div>
                <span class="font14 title-box">몰 오픈 축하합니다.</span>
              </div>
              <span class="font16 date-box">2020-09-24</span>
            </a>
          </div>
          <div class="post-bar">
            <a href="#">
              <div class="left-box">
                <div class="left-inner">
                  <span class="font16b text">다음글</span>
                  <span class="font12 tab">|</span>
                </div>
                <span class="font14 title-box">등록된 다음 게시물이 없습니다.</span>
              </div>
              <span class="font16 date-box"></span>
            </a>
          </div>
        </div>

        <div class="button-wrap">
          <button class="font16b">목록</button>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
