<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
  <title>마이페이지 - 오마이프린트</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="./css/myPage.css" />
  <link rel="stylesheet" href="/css/modal.css" />
  <script src="../js/include.js" defer></script>
  <script src="./js/mypage.js" defer></script>
</head>

<body>
  <header id="header"></header>
  <main>
    <section class="myPage-wrap">
      <div class="inner">
        <div class="title-wrap">
          <h2 class="font28">마이페이지</h2>
        </div>
        <div class="mypage-top">
          <div class="user-level-wrap">
            <p class="font20">
              <span class="user-name fon20b">'이젠'</span>
              고객님의 회원등급은
            </p>
            <p class="font28">
              <span class="level">VIP</span>
              등급입니다.
            </p>
          </div>
          <div class="shopping-info-wrap">
            <ul class="order-list-wrap">
              <li class="font16b payment">1</li>
              <li class="font16b confirmed">0</li>
              <li class="font16b processing">0</li>
              <li class="font16b shipping">1</li>
              <li class="font16b delivered">12</li>
            </ul>
            <ul class="dashboard-wrap">
              <li class="coupons font14b">
                100
                <span>장</span>
              </li>
              <li class="mileage font14b">
                1,000
                <span>p</span>
              </li>
              <li class="posts font14b">33</li>
            </ul>
          </div>
        </div>
        <div class="mypage-bottom">
          <ul class="user-dashboard-wrap">
            <li>
              <div class="top">
                <p class="font12">Wishlist</p>
                <p class="font16b">관심상품</p>
              </div>
              <p class="bottom font12">바로가기</p>
            </li>
            <li>
              <div class="top">
                <p class="font12">Profile</p>
                <p class="font16b">회원정보</p>
              </div>
              <p class="bottom font12">바로가기</p>
            </li>
            <li>
              <div class="top">
                <p class="font12">Coupon</p>
                <p class="font16b">쿠폰</p>
              </div>
              <p class="bottom font12">바로가기</p>
            </li>
            <li>
              <div class="top">
                <p class="font12">Mileage</p>
                <p class="font16b">마일리지</p>
              </div>
              <p class="bottom font12">바로가기</p>
            </li>
            <li>
              <div class="top">
                <p class="font12">Order</p>
                <p class="font16b">주문내역</p>
              </div>
              <p class="bottom font12">바로가기</p>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>
  <!-- 푸터 -->
  <footer id="footer"></footer>
</body>

</html>
