<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
    <title>상품 리스트 - 오마이프린트</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="./css/productList.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <script src="../js/include.js" defer></script>
    <script src="./js/productList.js" defer></script>
  </head>
  <body>
    <header id="header"></header>
    <main>
      <div class="inner">
        <nav>
          <ul class="main-category">
            <li class="font20b active"><a href="#">명함</a></li>
            <li class="font20b"><a href="#">간판</a></li>
            <li class="font20b"><a href="#">상패</a></li>
            <li class="font20b"><a href="#">현수막</a></li>
            <li class="font20b"><a href="#">흥보용품</a></li>
            <li class="font20b"><a href="#">쿠폰</a></li>
            <li class="font20b"><a href="#">카탈로그</a></li>
            <li class="font20b"><a href="#">실사출력</a></li>
          </ul>
        </nav>
        <div class="item-wrap">
          <div class="filter-wrap">
            <div class="dropdown">
              <div class="dropBox font16">정렬 기준</div>
              <ul id="sort" class="sort-list">
                <li class="new"><a class="font14" href="#void">신상품순</a></li>
                <li class="review"><a class="font14" href="#void">리뷰많은순</a></li>
                <li class="asc"><a class="font14" href="#void">가나다순</a></li>
                <li class="desc"><a class="font14" href="#void">역가나다순</a></li>
              </ul>
            </div>
            <div class="search-wrap">
              <input type="text" class="font16" placeholder="필요한 상품을 검색해 보세요" />
              <button class="search-icon"></button>
            </div>
          </div>
          <section class="item-container">
            <div class="card-wrap"></div>
          </section>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
